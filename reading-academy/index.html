<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Academy</title><style>body{font-family:Arial,sans-serif;background:#F7F4ED;display:grid;place-items:center;min-height:100vh;margin:0}.load{padding:24px;border:3px solid #111;border-radius:20px;background:white;font-weight:900}</style></head><body><div class="load">Loading Reading Academy…</div><script src="payload-1.js"></script><script src="payload-2.js"></script><script src="payload-3.js"></script><script src="payload-4.js"></script><script>(async()=>{try{const b64=window.RA_PARTS.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close();}catch(e){document.body.innerHTML='<div class="load">Please refresh the page in a modern browser.</div>';console.error(e)}})();</script></body></html>
